name: CI
on:
  push: { branches: [ main ] }
  pull_request:

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix: { php: [ '8.1', '8.3' ] }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}', coverage: none }
      - run: composer install --no-progress
      - run: composer lint
      - run: composer stan
      - run: composer test:unit

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm run build
      - run: npm run tsc
      - run: npm run test:js
      - run: npx fallow --ci

  integration-and-concurrency:
    runs-on: ubuntu-latest
    # wp-env names the plugin mount after the host directory basename, and the
    # test scripts address wp-content/plugins/reservant. Check out to a fixed
    # "reservant" path so CI matches local development regardless of repo name.
    defaults:
      run: { working-directory: reservant }
    steps:
      - uses: actions/checkout@v4
        with: { path: reservant }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.1', coverage: none }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: composer install --no-progress
      - run: npm ci
      # `Admin\AdminPage` enqueues build/admin.js on its own wp-admin pages (Task 13) - the
      # integration suite exercises that enqueue path for real, so the bundle has to exist before
      # it runs, same as it would on a released site.
      - run: npm run build
      - run: npx wp-env start
      - run: composer test:integration
      - run: sudo apt-get install -y jq && chmod +x bin/run-concurrency.sh && ./bin/run-concurrency.sh
      # Admin smoke e2e (AGENTS.md P4, final task): rebuilds the bundle (harmless if already
      # current - the PHP suites above needed it too), installs the one browser the spec uses,
      # then drives the running wp-env site through Playwright. `.wp-env.json`'s own
      # `lifecycleScripts.afterStart` already switched the site to pretty permalinks as part of
      # `wp-env start` above - a fresh WordPress install defaults to plain permalinks, under which
      # any REST call carrying its own query string 404s (`rest_route=...` collides with the
      # request's own `?`), so this is not optional environment polish.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
